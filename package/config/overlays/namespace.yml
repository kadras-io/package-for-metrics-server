#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/metrics_server.star", "upstream_namespace")

#! Metrics Server runs in the package namespace, which is created by the package unless it's `kube-system`.
#! The RoleBinding granting access to the authentication configuration of the API server stays in `kube-system`,
#! where that configuration and the Role to read it are.
#! See: https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/#authentication-flow

#@ namespace = data.values.namespace

#@ if namespace != upstream_namespace:
---
apiVersion: v1
kind: Namespace
metadata:
  name: #@ namespace
#@ end

#@ auth_reader = overlay.subset({"kind":"RoleBinding", "metadata":{"name":"metrics-server-auth-reader"}})

#@overlay/match by=overlay.and_op(overlay.subset({"metadata":{"namespace":upstream_namespace}}), overlay.not_op(auth_reader)), expects="1+"
---
metadata:
  namespace: #@ namespace

#@overlay/match by=overlay.or_op(overlay.subset({"kind":"ClusterRoleBinding"}), overlay.subset({"kind":"RoleBinding"})), expects="1+"
---
subjects:
#@overlay/match by=overlay.subset({"kind":"ServiceAccount"}), expects="1+"
- namespace: #@ namespace

#@overlay/match by=overlay.subset({"kind":"APIService"})
---
spec:
  service:
    namespace: #@ namespace
