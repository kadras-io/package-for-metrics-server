#@ load("/lib/validation.star", "is_dns_label")

#@ def kubelet_tls_consistent(values):
#@   return not (values["kubelet"]["insecure_tls"] and values["kubelet"]["ca_cert_data"])
#@ end

#@data/values-schema
#@schema/validation ("`kubelet.ca_cert_data` to be empty when `kubelet.insecure_tls` is true, since the Kubelet certificates aren't verified", kubelet_tls_consistent)
---

#@schema/desc "The namespace in which to deploy Metrics Server. It's created by the package, unless it's `kube-system`."
#@schema/validation ("a valid DNS label", is_dns_label), min_len=1, max_len=63
namespace: kube-system

#! =============================================
#! Server
#! =============================================

#@schema/desc "The number of Metrics Server replicas. With more than one, each replica runs on a different node, and a PodDisruptionBudget keeps at least one available."
#@schema/validation min=1
replicas: 1

#@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://github.com/kubernetes-sigs/metrics-server/blob/master/docs/command-line-flags.txt."
#@schema/examples ("Metric resolution", {"metric-resolution": "30s"}), ("Kubelet address types", {"kubelet-preferred-address-types": "Hostname,InternalIP"}), ("TLS hardening", {"tls-min-version": "VersionTLS13"})
#@schema/type any=True
args: {}

#! =============================================
#! Kubelet
#! =============================================

#@schema/desc "Settings for the connection to the Kubelets, from which Metrics Server collects the metrics."
kubelet:
  #@schema/desc "Whether to skip the verification of the Kubelet serving certificates. Only for clusters where they are self-signed, like kind and the default kubeadm setup."
  insecure_tls: false
  #@schema/desc "PEM-encoded certificates of the certificate authority that signed the Kubelet serving certificates, when it's not the cluster one."
  ca_cert_data: ""

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs."
observability:
  logging:
    #@schema/desc "The log level: `info` for the essential messages, `debug` and `trace` for increasingly detailed ones. For a specific verbosity, set the `v` flag via `args`."
    #@schema/validation one_of=["info", "debug", "trace"]
    level: info
    #@schema/desc "The format of the logs."
    #@schema/validation one_of=["text", "json"]
    format: json

#! =============================================
#! Policies
#! =============================================

#@schema/desc "Settings for the Kyverno policies."
policies:
  #@schema/desc "Whether to include the Kyverno policies that validate and secure the package installation. They require Kyverno 1.19 or later."
  enabled: false
