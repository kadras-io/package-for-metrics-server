---
apiVersion: v1
kind: Secret
metadata:
  name: metrics-server-values
  namespace: tests
stringData:
  values.yaml: |
    namespace: monitoring
    # The kind Kubelets have self-signed serving certificates.
    kubelet:
      insecure_tls: true
    args:
      metric-resolution: 10s
    observability:
      logging:
        verbosity: 2
        format: text
