# Metrics Server is running, and registered in the Kubernetes API.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
status:
  readyReplicas: 1
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
spec:
  service:
    name: metrics-server
    namespace: kube-system
status:
  conditions:
  - type: Available
    status: "True"
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: kube-system
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  template:
    spec:
      imagePullSecrets:
        - name: canonical-registry-credentials
