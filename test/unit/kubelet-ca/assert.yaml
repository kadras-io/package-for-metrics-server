apiVersion: v1
kind: Secret
metadata:
  name: metrics-server-kubelet-ca
  namespace: kube-system
stringData:
  (starts_with("ca.crt", '-----BEGIN CERTIFICATE-----')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
spec:
  template:
    spec:
      (volumes[?name == 'kubelet-ca'] | [0].secret.secretName): metrics-server-kubelet-ca
      (containers[?name == 'metrics-server'] | [0]):
        (contains(args, '--kubelet-certificate-authority=/etc/ssl/kubelet/ca.crt')): true
        (volumeMounts[?name == 'kubelet-ca'] | [0].mountPath): /etc/ssl/kubelet
