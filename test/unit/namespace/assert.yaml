apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: critical-pods
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: monitoring
---
# The Role to read the authentication configuration of the API server is in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-server-auth-reader
  namespace: kube-system
subjects:
- name: metrics-server
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server:system:auth-delegator
(subjects[?namespace != 'monitoring'] | length(@)): 0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:metrics-server
(subjects[?namespace != 'monitoring'] | length(@)): 0
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
spec:
  service:
    namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: monitoring
